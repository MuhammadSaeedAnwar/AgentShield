[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield"
version = "0.1.0"
description = "AgentShield: a reproducible benchmark for evaluating prompt-injection and unsafe-tool-use vulnerabilities in tool-using LLM agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgentShield contributors" }]
keywords = [
  "prompt-injection",
  "llm-agents",
  "ai-safety",
  "security-benchmark",
  "tool-use",
  "evaluation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core benchmark engine (dataset loading, agent loop, mock model, defenses,
# evaluation, metrics) depends ONLY on the Python standard library, so that a
# reproduction run cannot break because of a transitive dependency update.
dependencies = []

[project.optional-dependencies]
# Needed only for `agentshield.analyze` chart output and YAML config files.
analysis = ["matplotlib>=3.6", "pandas>=1.5"]
config = ["pyyaml>=6.0"]
dev = ["pytest>=7.2", "matplotlib>=3.6", "pandas>=1.5", "pyyaml>=6.0"]

[project.scripts]
agentshield-run = "agentshield.run:main"
agentshield-analyze = "agentshield.analyze:main"

[project.urls]
Homepage = "https://github.com/MuhammadSaeedAnwar/AgentShield"
Issues = "https://github.com/MuhammadSaeedAnwar/AgentShield/issues"

[tool.setuptools.packages.find]
include = ["agentshield*"]

[tool.setuptools.package-data]
agentshield = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
